apiVersion: 1

groups:
  - orgId: 1
    name: raft-health
    folder: Raft
    interval: 30s
    rules:
      - uid: raft_node_down
        title: Raft node is down
        condition: A
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: A Raft node stopped answering scrapes
          description: The cluster still has quorum, but it lost one replica.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: up{job="raft"} == 0

      - uid: raft_no_leader
        title: Raft cluster has no leader
        condition: A
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: The cluster has no single leader
          description: Writes are rejected until an election succeeds.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: sum(raft_is_leader) != 1

      - uid: raft_quorum_at_risk
        title: Raft quorum is at risk
        condition: A
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Two of five nodes are unreachable
          description: One more failure stops the cluster from committing writes.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: count(up{job="raft"} == 0) >= 2

      - uid: raft_quorum_lost
        title: Raft quorum is lost
        condition: A
        for: 30s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Three or more nodes are down
          description: The cluster cannot commit writes until nodes come back.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: count(up{job="raft"} == 0) >= 3
