syntax = "proto3";

package raft.v1;

option go_package = "github.com/RishatShay/sna-final-project/internal/raftpb;raftpb";

// RaftService carries consensus traffic between cluster nodes.
service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// ClientService is the public key/value API. A follower forwards every call to
// the leader it knows about, so clients may talk to any node.
service ClientService {
  rpc Write(WriteRequest) returns (WriteResponse);
  rpc Delete(DeleteRequest) returns (WriteResponse);
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc InspectLog(InspectLogRequest) returns (InspectLogResponse);
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  // JSON encoded state machine command, for example {"op":"set","key":"a","value":"1"}.
  bytes command = 3;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  // Highest log index the follower is known to hold after this call.
  uint64 match_index = 3;
}

message InstallSnapshotRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes data = 5;
}

message InstallSnapshotResponse {
  uint64 term = 1;
}

message WriteRequest {
  string key = 1;
  string value = 2;
}

message DeleteRequest {
  string key = 1;
}

message WriteResponse {
  string leader_id = 1;
  uint64 index = 2;
  uint64 term = 3;
}

message ReadRequest {
  string key = 1;
}

message ReadResponse {
  string leader_id = 1;
  string value = 2;
}

message StatusRequest {}

message PeerStatus {
  string id = 1;
  string address = 2;
  uint64 match_index = 3;
  uint64 next_index = 4;
}

message StatusResponse {
  string id = 1;
  string role = 2;
  uint64 term = 3;
  string leader_id = 4;
  uint64 commit_index = 5;
  uint64 last_applied = 6;
  uint64 last_log_index = 7;
  uint64 snapshot_index = 8;
  repeated PeerStatus peers = 9;
}

message InspectLogRequest {}

// InspectLogResponse exposes the raw replicated log and the state machine of a
// single node so that clients can compare nodes with each other.
message InspectLogResponse {
  string id = 1;
  string role = 2;
  uint64 term = 3;
  uint64 commit_index = 4;
  uint64 last_applied = 5;
  uint64 snapshot_index = 6;
  repeated LogEntry entries = 7;
  map<string, string> state = 8;
}
